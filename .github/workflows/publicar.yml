name: Publicar en Instagram

on:
  schedule:
    # 13:00, 16:00 y 19:00 hora de Chile (UTC-3) = 16:00, 19:00 y 22:00 UTC.
    # El turno de las 16:00 es para los reels de redes, dia por medio; los
    # dias sin pieza asignada la corrida no publica nada y no pasa nada.
    - cron: "0 16,19,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar el post de hoy
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python publicar.py

      - name: Guardar el estado del calendario
        run: |
          if [ -n "$(git status --porcelain calendario.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add calendario.json
            git commit -m "Marca el post como publicado"
            subido=0
            for i in 1 2 3 4 5; do
              if git push; then subido=1; break; fi
              echo "Rechazado: otro proceso empujo mientras corriamos. Rebaso y reintento ($i)."
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((i * 5))
            done
            [ "$subido" = 1 ] || { echo "No se pudo subir despues de 5 intentos."; exit 1; }
          else
            echo "Sin cambios en el calendario."
          fi
