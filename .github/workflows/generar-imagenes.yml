name: Generar imagenes

on:
  push:
    paths:
      - "calendario.json"
      - "generar.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generar las graficas
        run: python generar.py

      - name: Guardar las imagenes
        run: |
          if [ -n "$(git status --porcelain imagenes/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add imagenes/
            git commit -m "Regenera las graficas de Instagram"
            subido=0
            for i in 1 2 3 4 5; do
              if git push; then subido=1; break; fi
              echo "Rechazado: otro proceso empujo mientras corriamos. Rebaso y reintento ($i)."
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((i * 5))
            done
            [ "$subido" = 1 ] || { echo "No se pudo subir despues de 5 intentos."; exit 1; }
          else
            echo "Las imagenes ya estaban al dia."
          fi
